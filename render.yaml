services:
  - type: web
    name: skuard
    runtime: node
    plan: starter
    numInstances: 1
    buildCommand: npm ci && npm run prisma -- generate && npm run build
    startCommand: npm run start:render
    healthCheckPath: /health
    disk:
      name: skuard-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 20.19.4
      - key: DATABASE_URL
        value: file:/var/data/skuard.sqlite
      - key: SCOPES
        value: read_products
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: SHOPIFY_APP_URL
        sync: false
